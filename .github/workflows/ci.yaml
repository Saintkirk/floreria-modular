name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4  # Actualizado a v4
    
    - name: Set up Python
      uses: actions/setup-python@v5  # Actualizado a v5
      with:
        python-version: '3.9'
        cache: 'pip'  # Habilitar caché para velocidad
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Asegurar que las dependencias de test estén instaladas
        pip install pytest pytest-cov mongomock
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage
      uses: actions/upload-artifact@v4  # Actualizado a v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml